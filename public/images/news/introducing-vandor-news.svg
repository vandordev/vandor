<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Introducing Vandor News</title>
  <desc id="desc">Abstract black and white cover art for Vandor News.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="100%" stop-color="#1e1e1e" />
    </linearGradient>
    <linearGradient id="line" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#f3f3f3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f3f3f3" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1240" cy="180" r="240" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="310" cy="720" r="290" fill="#ffffff" fill-opacity="0.06" />
  <rect x="110" y="120" width="520" height="18" rx="9" fill="url(#line)" />
  <rect x="110" y="168" width="700" height="18" rx="9" fill="#ffffff" fill-opacity="0.18" />
  <rect x="110" y="216" width="430" height="18" rx="9" fill="#ffffff" fill-opacity="0.18" />
  <rect x="110" y="600" width="1380" height="1" fill="#ffffff" fill-opacity="0.18" />
  <text x="110" y="470" fill="#fafafa" font-family="Geist, Arial, sans-serif" font-size="132" font-weight="600" letter-spacing="-3">
    Vandor News
  </text>
  <text x="116" y="535" fill="#d0d0d0" font-family="Geist, Arial, sans-serif" font-size="34" letter-spacing="8">
    ANNOUNCEMENTS / ESSAYS / RELEASE NOTES
  </text>
</svg>
